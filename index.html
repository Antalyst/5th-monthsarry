<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Song, Jovelyn</title>
<meta name="theme-color" content="#f7f2fb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=EB+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* Palette from the 4th-monthsarry site */
:root{
  --background:#f7f2fb; --paper:#fdfbff; --surface-low:#f4edfa; --surface:#ece1f5; --surface-high:#e3d3ef;
  --on-surface:#221a2b; --on-surface-variant:#5a4a68; --primary:#6c3fa0; --primary-deep:#4a2474;
  --primary-container:#c9a0e8; --secondary:#9d5fc0; --blush:#e8a3d6; --outline:#83709a; --outline-variant:#dcc9ec; --ink:#2b1d38;
  --night:#1a1022;
  --serif:'EB Garamond',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --hand:'Caveat','Segoe Print',cursive;
  --ease-out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.5,.64,1);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);color:var(--on-surface);background:var(--background);transition:background-color 1.4s;-webkit-tap-highlight-color:transparent}
body.night{background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
img,video{display:block}
:focus-visible{outline:3px solid var(--blush);outline-offset:3px}

.screen{position:fixed;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .9s,visibility 0s .9s}
.screen.show{opacity:1;visibility:visible;transition:opacity .9s}
.light{background:radial-gradient(circle at 15% 0%,#efe0fb 0%,rgba(239,224,251,0) 45%),radial-gradient(circle at 100% 100%,#f5e3f3 0%,rgba(245,227,243,0) 40%),var(--background)}
.kicker{font-family:var(--hand);font-size:28px;line-height:1;color:var(--secondary)}
.title{font-family:var(--serif);font-weight:600;color:var(--primary-deep);font-size:clamp(34px,9vw,52px);line-height:1;letter-spacing:-.01em;margin:6px 0 4px}
.sub{color:var(--on-surface-variant);font-size:15px}

/* ---------- Lock ---------- */
.lock{width:min(340px,100% - 32px);text-align:center}
.slots{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:26px 0 8px}
.slots .sep{font-family:var(--serif);font-size:30px;color:var(--outline-variant);padding:0 2px 6px}
.slot{width:38px;height:52px;border-bottom:2px solid var(--outline-variant);font-family:var(--serif);font-weight:600;font-size:34px;color:var(--primary-deep);display:grid;place-items:end center;padding-bottom:4px;transition:border-color .2s}
.slot.cur{border-color:var(--primary);animation:blink 1s infinite}
@keyframes blink{50%{border-color:var(--outline-variant)}}
.slots.ok .slot{border-color:var(--secondary);color:var(--secondary)}
.slots.bad{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lock-msg{font-family:var(--hand);font-size:24px;color:var(--secondary);height:30px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;justify-items:center}
.keypad button{width:min(72px,20vw);aspect-ratio:1;border-radius:50%;border:1px solid var(--outline-variant);background:var(--paper);font-family:var(--serif);font-size:28px;color:var(--primary-deep);box-shadow:0 6px 18px rgba(76,33,122,.08);transition:transform .12s,background .2s}
.keypad button:active{transform:scale(.9);background:var(--surface)}
.keypad .ghost{border-color:transparent;background:transparent;box-shadow:none;font-family:var(--sans);font-size:20px;color:var(--outline)}

/* ---------- Song picker ---------- */
.pick{width:min(560px,100% - 32px);text-align:center;max-height:100%;overflow:auto;padding:24px 0}
.songs{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin:22px 0 16px}
.song{border:0;background:none;padding:0;text-align:left}
.sleeve{position:relative;aspect-ratio:1;border-radius:10px;overflow:visible}
.sleeve .cover{position:absolute;inset:0;border-radius:10px;z-index:2;box-shadow:0 14px 30px rgba(76,33,122,.25);display:flex;align-items:flex-end;padding:12px;
  font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(20px,6vw,30px);line-height:1;color:#fff;overflow:hidden}
.sleeve .cover::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.35),transparent 50%)}
.sleeve .cover span{position:relative}
.record{position:absolute;top:6%;left:6%;width:88%;aspect-ratio:1;border-radius:50%;z-index:1;
  background:radial-gradient(circle,var(--blush) 0 15%,#120a1a 15.5% 17%,#2b1d38 17.5% 100%);transform:translateX(9%);transition:transform .7s var(--ease-out)}
.record::after{content:"";position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.06) 0 1px,transparent 1px 4px);-webkit-mask:radial-gradient(circle,transparent 30%,#000 31%);mask:radial-gradient(circle,transparent 30%,#000 31%)}
.song:hover .record,.song:focus-visible .record{transform:translateX(18%)}
.song.chosen .record{transform:translateX(42%);animation:spin 1.4s linear infinite .5s}
@keyframes spin{from{transform:translateX(42%) rotate(0)}to{transform:translateX(42%) rotate(360deg)}}
.song .name{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--primary-deep);margin-top:10px;line-height:1.1}
.song .by{font-size:13px;color:var(--outline)}
.custom{display:flex;gap:8px;margin-top:6px}
.custom input{flex:1;min-width:0;border:1px solid var(--outline-variant);background:var(--paper);border-radius:99px;padding:10px 14px;font:inherit;font-size:14px;color:var(--on-surface)}
.custom button,.btn{border:0;border-radius:99px;padding:10px 18px;background:linear-gradient(135deg,var(--secondary),var(--primary));color:#fff;font-weight:500;font-size:14px;box-shadow:0 8px 20px rgba(108,63,160,.3)}
.btn.soft{background:rgba(253,251,255,.12);box-shadow:none;border:1px solid rgba(232,163,214,.5);color:#fdfbff}

/* ---------- Now playing gate ---------- */
#now{color:#fdfbff;text-align:center;background:radial-gradient(circle at 50% 30%,#4a2474 0%,#2b1d38 50%,var(--night) 100%)}
.now-in{width:min(460px,100% - 32px);padding-top:min(52svh,360px)}
.now-in .t{font-family:var(--serif);font-size:30px;font-weight:600}
.now-in .s{font-family:var(--hand);font-size:24px;color:var(--blush);margin-top:2px}
.now-in .st{font-size:14px;color:var(--surface-high);margin:14px 0;min-height:20px}
#skip{display:none}
#ytwrap{position:fixed;z-index:30;left:50%;top:30%;width:min(86vw,420px);aspect-ratio:16/9;transform:translate(-50%,-50%);border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(232,163,214,.45),0 0 60px rgba(232,163,214,.25);background:#000;opacity:0;pointer-events:none;
  transition:left 1s var(--ease-out),top 1s var(--ease-out),width 1s var(--ease-out),opacity .6s,border-radius 1s}
#ytwrap.show{opacity:1;pointer-events:auto}
#ytwrap.mini{left:calc(12px + var(--mw)/2);top:calc(100% - var(--bot) - 14px - var(--mw)*.28125);width:var(--mw);border-radius:8px}
#ytwrap iframe,#yt{width:100%;height:100%;border:0;display:block}
:root{--mw:112px}
@media(min-width:900px){:root{--mw:176px}}

/* ---------- Story ---------- */
#story{place-items:stretch;overflow:hidden;color:#fdfbff}
.bgimg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.25) brightness(.5);opacity:0;transition:opacity 1.6s}
.bgimg.on{opacity:1}
.veil{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 35%,rgba(108,63,160,.25),rgba(26,16,34,.85) 75%)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#chapter{position:absolute;top:calc(var(--top) + 12px);left:16px;right:16px;text-align:center;font-family:var(--hand);font-size:24px;color:var(--blush);transition:opacity .6s}
#media{position:absolute;left:0;right:0;top:calc(var(--top) + 52px);height:50svh;perspective:1000px}
@media(min-width:900px){#media{height:58svh}}
#lyric{position:absolute;left:16px;right:16px;top:calc(var(--top) + 52px + 50svh + 14px);text-align:center;transition:top 1s var(--ease-out)}
@media(min-width:900px){#lyric{top:calc(var(--top) + 52px + 58svh + 14px)}}
#lyric.center{top:30svh}
.line{position:absolute;left:0;right:0;margin:0 auto;max-width:22ch;font-family:var(--serif);font-weight:600;font-size:clamp(26px,7.2vw,44px);line-height:1.12;letter-spacing:-.005em;
  transition:opacity .7s,transform .9s var(--ease-out),filter .7s,font-size 1s var(--ease-out)}
#lyric.center .line{font-size:clamp(36px,10.5vw,72px);max-width:16ch}
.line.enter{opacity:0;transform:translateY(24px);filter:blur(6px)}
.line.out{opacity:0;transform:translateY(-26px);filter:blur(6px)}
.wd{--p:0;display:inline;background:linear-gradient(90deg,#fdfbff calc(var(--p)*100%),rgba(253,251,255,.22) calc(var(--p)*100% + .01%));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 calc(var(--p)*18px) rgba(232,163,214,calc(var(--p)*.55))}
.line.hand{font-family:var(--hand);font-weight:700;color:var(--blush)}
.answers{display:flex;gap:12px;justify-content:center;position:absolute;left:0;right:0}
.answers .btn{font-size:17px;padding:12px 22px}
.said{position:absolute;left:0;right:0;font-family:var(--hand);font-size:34px;color:var(--blush);animation:pop .8s var(--spring)}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* bottom bar */
#bar{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(var(--bot) + 12px) calc(var(--mw) + 26px);display:flex;align-items:center;gap:12px;min-height:calc(var(--mw)*.5625 + var(--bot) + 26px)}
.track{position:absolute;left:0;right:0;bottom:calc(var(--mw)*.5625 + var(--bot) + 24px);height:3px;background:rgba(253,251,255,.14)}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--secondary),var(--blush))}
.track b{position:absolute;top:-3px;width:2px;height:9px;background:rgba(232,163,214,.6)}
.meta{flex:1;min-width:0}
.meta .n{font-family:var(--serif);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .tm{font-size:12px;color:var(--surface-high);font-variant-numeric:tabular-nums}
#pause{width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,163,214,.5);background:rgba(253,251,255,.08);display:grid;place-items:center;color:#fdfbff}
#notice{position:absolute;left:16px;right:16px;bottom:calc(var(--mw)*.5625 + var(--bot) + 34px);text-align:center;font-size:13px;color:var(--surface-high);opacity:0;transition:opacity .6s}
#endctl{position:absolute;left:0;right:0;bottom:calc(var(--mw)*.5625 + var(--bot) + 40px);display:flex;gap:10px;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s}
#endctl.show{opacity:1;pointer-events:auto}

/* scenes */
.scene{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .9s}
.scene.out{opacity:0}
.pol{background:#fdfbff;padding:8px 8px 34px;box-shadow:0 24px 50px rgba(0,0,0,.45);position:relative}
.pol .ph{overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover}
.kb{animation:kb var(--dur) linear forwards}
@keyframes kb{from{transform:scale(1.18) translate(2%,2%)}to{transform:scale(1) translate(0,0)}}
.dev{animation:dev 2.2s ease-out forwards}
@keyframes dev{from{filter:brightness(1.8) sepia(.6) blur(3px)}to{filter:none}}

.single .pol{width:min(66vw,38svh)}
.single .ph{aspect-ratio:4/5}
.single .pol{animation:drop 1.2s var(--spring) both}
@keyframes drop{from{transform:translateY(-70svh) rotate(-28deg)}to{transform:rotate(-3deg)}}
.single.alt .pol{animation-name:drop2}
@keyframes drop2{from{transform:translateY(-70svh) rotate(26deg)}to{transform:rotate(3deg)}}

.duo .pol{position:absolute;width:min(48vw,28svh)}
.duo .ph{aspect-ratio:4/5}
.duo .pol:nth-child(1){left:calc(50% - min(44vw,25svh));top:8%;animation:inL 1.1s var(--ease-out) both}
.duo .pol:nth-child(2){left:calc(50% - min(4vw,3svh));top:22%;animation:inR 1.1s var(--ease-out) .25s both}
@keyframes inL{from{transform:translateX(-90vw) rotate(-30deg)}to{transform:rotate(-7deg)}}
@keyframes inR{from{transform:translateX(90vw) rotate(30deg)}to{transform:rotate(6deg)}}

.strip{display:flex;gap:12px;padding:20px 12px;background:#0f0915;position:relative;animation:slide var(--dur) linear forwards;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(253,251,255,.55) 8px 16px)}
.strip::before{top:6px}.strip::after{bottom:6px}
.strip .fr{width:min(46vw,27svh);aspect-ratio:3/4;overflow:hidden;flex:none}
.strip .fr img{width:100%;height:100%;object-fit:cover}
.filmwrap{width:100%;overflow:visible;display:flex;justify-content:flex-start;transform:rotate(-4deg)}
@keyframes slide{from{transform:translateX(12vw)}to{transform:translateX(calc(-100% + 88vw))}}
@media(min-width:900px){@keyframes slide{from{transform:translateX(30vw)}to{transform:translateX(calc(-100% + 70vw))}}}

.video .phone{height:min(48svh,86vw*16/9);aspect-ratio:9/16;border-radius:26px;overflow:hidden;border:5px solid #0f0915;box-shadow:0 0 0 1px rgba(232,163,214,.5),0 30px 60px rgba(0,0,0,.55);animation:turn 1.3s var(--ease-out) both;background:#000}
@media(min-width:900px){.video .phone{height:54svh}}
.video .phone video{width:100%;height:100%;object-fit:cover}
@keyframes turn{from{transform:rotateY(75deg) rotateZ(-8deg) scale(.7);opacity:0}to{transform:rotateZ(-2deg)}}

.full .frame{width:min(92vw,78svh);height:100%;border-radius:18px;overflow:hidden;animation:iris 1.6s var(--ease-out) both;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.full .frame img{width:100%;height:100%;object-fit:cover}
@keyframes iris{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}

.art img{height:92%;width:auto;max-width:90vw;opacity:.85;animation:reveal 3.5s ease-out both}
@keyframes reveal{from{-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 0%);mask-image:linear-gradient(to top,#000 0%,transparent 0%);opacity:0}
  30%{opacity:.85}to{-webkit-mask-image:linear-gradient(to top,#000 100%,transparent 120%);mask-image:linear-gradient(to top,#000 100%,transparent 120%)}}

.mosaic .heart{position:relative;width:min(86vw,60svh);height:100%;animation:beat 1.6s ease-in-out infinite 3s}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.05)}24%{transform:scale(1)}36%{transform:scale(1.03)}}
.tile{position:absolute;overflow:hidden;border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.4);border:2px solid #fdfbff;transition:transform 1.6s var(--ease-out),opacity .8s}
.tile img{width:100%;height:100%;object-fit:cover}

.fly{position:fixed;pointer-events:none;z-index:50;animation:fly var(--d) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);opacity:0}}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<!-- 1. Lock -->
<section class="screen light show" id="lock" aria-label="Enter the passcode">
  <div class="lock">
    <p class="kicker">for Jovelyn</p>
    <h1 class="title">Enter our day</h1>
    <p class="sub">month, day, year</p>
    <div class="slots" id="slots" aria-live="polite">
      <span class="slot"></span><span class="slot"></span><span class="sep">/</span><span class="slot"></span><span class="slot"></span><span class="sep">/</span><span class="slot"></span><span class="slot"></span>
    </div>
    <p class="lock-msg" id="lockMsg"></p>
    <div class="keypad" id="keypad"></div>
  </div>
</section>

<!-- 2. Song picker -->
<section class="screen light" id="pick" aria-label="Pick our song">
  <div class="pick">
    <p class="kicker">turn your volume up</p>
    <h1 class="title">Pick our song</h1>
    <p class="sub">The story plays along with whichever one you choose.</p>
    <div class="songs" id="songs"></div>
    <form class="custom" id="custom"><input id="customUrl" type="url" placeholder="or paste any YouTube link" aria-label="YouTube link"><button type="submit">Play</button></form>
  </div>
</section>

<!-- 3. Now playing -->
<section class="screen" id="now" aria-label="Starting the music">
  <div class="now-in">
    <p class="t" id="nowTitle"></p>
    <p class="s">lights down, it's our song</p>
    <p class="st" id="nowStatus">Loading the music…</p>
    <button class="btn soft" id="skip" type="button">Start the story without music</button>
  </div>
</section>
<div id="ytwrap"><div id="yt"></div></div>

<!-- 4. Story -->
<section class="screen" id="story" aria-label="Our story">
  <div class="bgimg" id="bgA"></div><div class="bgimg" id="bgB"></div><div class="veil"></div>
  <canvas id="fx"></canvas>
  <p id="chapter"></p>
  <p id="notice"></p>
  <div id="media"></div>
  <div id="lyric" aria-live="polite"></div>
  <div id="endctl"><button class="btn" id="again" type="button">Play again</button><button class="btn soft" id="another" type="button">Pick another song</button></div>
  <div class="track" id="track"><i id="prog"></i></div>
  <div id="bar">
    <div class="meta"><p class="n" id="barTitle"></p><p class="tm" id="barTime">0:00</p></div>
    <button id="pause" type="button" aria-label="Pause">❚❚</button>
  </div>
</section>
<audio id="local" src="music.mp3" preload="metadata"></audio>

<script>
/* =================== Edit these =================== */
const PASSCODE = '053026';
const SONGS = [   // title, artist, YouTube video ids (first one that plays is used), sleeve colors
  {title:'Palagi', artist:'TJ Monterde', ids:['LPNF6HwdFe8','v82VtUUGFqk'], c:['#c9a0e8','#6c3fa0']},
  {title:'Until I Found You', artist:'Stephen Sanchez', ids:['MlThQTo6D8A','GxldQ9eX2wo'], c:['#e8a3d6','#9d5fc0']},
  {title:'Perfect', artist:'Ed Sheeran', ids:['2Vv-BfVoq4g'], c:['#9d5fc0','#2b1d38']},
  {title:'Ikaw', artist:'Yeng Constantino', ids:['EQsnyFqpzsE','b00C1HkgMx4'], c:['#f3c9e8','#6c3fa0']}
];
/* The story. Each line plays in order across the length of the song.
   layout: art | single | duo | film | video | full | text | question | mosaic
   w = how long the line stays (1 = normal)                          */
const STORY = [
  {ch:'how it started', layout:'art',    text:'Five months ago, on May 30,', w:1.1},
  {ch:'how it started', layout:'text',   text:'I started a story I never want to end.'},
  {ch:'how it started', layout:'single', m:['p00'], text:'It started with a girl hiding behind her phone,'},
  {ch:'how it started', layout:'film',   m:['p01','p07','p03'], text:'and a guy who couldn\'t stop smiling at her.', w:1.1},
  {ch:'our places',     layout:'duo',    m:['p12','p14'], text:'Cafés and long talks,'},
  {ch:'our places',     layout:'full',   m:['p10'], text:'the trees by the sea,'},
  {ch:'our places',     layout:'single', m:['p15'], text:'slow walks in the park,'},
  {ch:'our places',     layout:'video',  m:['v4'], text:'lazy afternoons where doing nothing felt like everything,', w:1.3},
  {ch:'our places',     layout:'video',  m:['v1'], text:'and late nights with my arm around you.', w:1.2},
  {ch:'thank you',      layout:'text',   text:'Jovelyn, first of all…'},
  {ch:'thank you',      layout:'single', m:['p16'], text:'thank you.', fx:'glow'},
  {ch:'thank you',      layout:'duo',    m:['p09','p06'], text:'Thank you for your patience on the days I\'m hard to understand.', w:1.3},
  {ch:'thank you',      layout:'single', m:['p08'], text:'Thank you for staying.'},
  {ch:'thank you',      layout:'film',   m:['p05','p11','p02'], text:'Thank you for choosing me, every single day.', w:1.2},
  {ch:'you',            layout:'single', m:['p02'], text:'Your smile still gets me. Every time.'},
  {ch:'you',            layout:'single', m:['p06'], text:'Even sleepy, even tired, you\'re my favorite view.', w:1.2},
  {ch:'you',            layout:'video',  m:['v3'], text:'You make ordinary days feel like something.'},
  {ch:'my promise',     layout:'single', m:['p18'], text:'So hear me when I say this:'},
  {ch:'my promise',     layout:'text',   text:'I\'m not going anywhere.', fx:'glow'},
  {ch:'my promise',     layout:'duo',    m:['p04','p13'], text:'Good days or hard days, I\'m right here.', w:1.2},
  {ch:'my promise',     layout:'full',   m:['p17'], text:'You\'re in all my plans, the small ones and the big ones.', w:1.3},
  {ch:'my promise',     layout:'text',   text:'I want to marry you.', fx:'burst', w:1.2},
  {ch:'my promise',     layout:'text',   text:'I want you for the rest of my life.'},
  {ch:'my promise',     layout:'question', text:'So… can I keep you forever?', w:1.5},
  {ch:'forever',        layout:'video',  m:['v2'], text:'Five months down.'},
  {ch:'forever',        layout:'text',   text:'Forever to go.', fx:'glow'},
  {ch:'happy 5th monthsarry', layout:'mosaic', text:'Happy 5th monthsarry, Jovelyn.', fin:1},
  {ch:'happy 5th monthsarry', layout:'mosaic', text:'I love you.', fin:1, fx:'burst'},
  {ch:'happy 5th monthsarry', layout:'mosaic', text:'Yours, always.', fin:1, hand:1}
];
/* ================================================= */

const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PHOTOS=[...Array(19)].map((_,i)=>'p'+String(i).padStart(2,'0'));
const src=k=>k[0]==='v'?'vid/'+k+'.jpg':'img/'+k+'.jpg';
PHOTOS.concat(['line-light']).forEach(k=>{const i=new Image();i.src=k==='line-light'?'img/line-light.png':src(k)});
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id))}

/* ---------- hearts ---------- */
const HC=['#e8a3d6','#c9a0e8','#9d5fc0','#f3c9e8','#fdfbff'];
function hearts(x,y,n,spread){if(reduce)return;spread=spread||90;
  for(let k=0;k<n;k++){const s=document.createElement('span');s.className='fly';s.textContent=['♥','♥','✦'][k%3];
    s.style.left=x+'px';s.style.top=y+'px';s.style.color=HC[k%HC.length];s.style.fontSize=(12+Math.random()*24)+'px';
    const a=Math.random()*Math.PI*2,d=spread*(.4+Math.random());
    s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',(Math.sin(a)*d-spread*.7)+'px');
    s.style.setProperty('--r',(Math.random()-.5)*160+'deg');s.style.setProperty('--d',(1.1+Math.random()*1.3)+'s');
    document.body.appendChild(s);setTimeout(()=>s.remove(),2700)}}

/* =================== 1. Lock =================== */
const slots=[...document.querySelectorAll('.slot')];let code='';
function drawSlots(){slots.forEach((s,i)=>{s.textContent=code[i]||'';s.classList.toggle('cur',i===code.length)})}
function press(k){
  if(code.length>=6&&k!=='del')return;
  if(k==='del'){code=code.slice(0,-1);$('#lockMsg').textContent='';drawSlots();return}
  code+=k;drawSlots();
  if(code.length===6){
    if(code===PASSCODE){$('#slots').classList.add('ok');slots.forEach(s=>s.classList.remove('cur'));$('#lockMsg').textContent='the day it all started ♥';
      const r=$('#slots').getBoundingClientRect();hearts(r.left+r.width/2,r.top+r.height/2,40,200);setTimeout(()=>go('pick'),1700)}
    else{$('#slots').classList.add('bad');$('#lockMsg').textContent='not quite. think of us.';
      setTimeout(()=>{$('#slots').classList.remove('bad');code='';drawSlots()},600)}
  }
}
['1','2','3','4','5','6','7','8','9','♥','0','del'].forEach(k=>{const b=document.createElement('button');b.type='button';
  b.textContent=k==='del'?'⌫':k;if(k==='del'||k==='♥')b.className='ghost';b.setAttribute('aria-label',k==='del'?'Delete':k==='♥'?'Heart':k);
  b.onclick=e=>{if(k==='♥'){hearts(e.clientX,e.clientY,10,70);return}press(k)};$('#keypad').appendChild(b)});
addEventListener('keydown',e=>{if(!$('#lock').classList.contains('show'))return;if(/^\d$/.test(e.key))press(e.key);if(e.key==='Backspace')press('del')});
drawSlots();

/* =================== 2. Song picker =================== */
SONGS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='song';
  b.innerHTML='<div class="sleeve"><div class="record"></div><div class="cover" style="background:linear-gradient(150deg,'+s.c[0]+','+s.c[1]+')"><span></span></div></div><p class="name"></p><p class="by"></p>';
  b.querySelector('.cover span').textContent=s.title;b.querySelector('.name').textContent=s.title;b.querySelector('.by').textContent=s.artist;
  b.onclick=()=>{document.querySelectorAll('.song').forEach(x=>x.classList.toggle('chosen',x===b));setTimeout(()=>startSong(s),650)};
  $('#songs').appendChild(b)});
$('#custom').onsubmit=e=>{e.preventDefault();const u=$('#customUrl').value.trim();
  const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/);
  if(!m){$('#customUrl').value='';$('#customUrl').placeholder='that link didn\'t work, try another';return}
  startSong({title:'Our song',artist:'picked by you',ids:[m[1]]})};

/* YouTube API (loads in the background while she types the passcode) */
let ytApi=false;window.onYouTubeIframeAPIReady=()=>{ytApi=true};
(()=>{const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytApi=false};document.head.appendChild(s)})();

/* =================== Music clock =================== */
let song=null,mode=null,player=null,idIdx=0,ytT=0,ytAt=0,ytOn=false,D=0,tBase=0,tAt=0,tOn=false,started=false,watch=[];
const SPEED=+(new URLSearchParams(location.search).get('speed')||1);
const local=$('#local');
function clock(){
  if(mode==='yt')return ytOn?ytT+(performance.now()-ytAt)/1000:ytT;
  if(mode==='audio')return local.currentTime;
  if(mode==='timer')return tOn?tBase+(performance.now()-tAt)/1000*SPEED:tBase;return 0}
function playing(){return mode==='yt'?ytOn:mode==='audio'?!local.paused:tOn}
function togglePause(){
  if(mode==='yt'){ytOn?player.pauseVideo():player.playVideo()}
  else if(mode==='audio'){local.paused?local.play():local.pause()}
  else{if(tOn){tBase=clock();tOn=false}else{tAt=performance.now();tOn=true}}
}
function clearWatch(){watch.forEach(clearTimeout);watch=[]}

function startSong(s){
  song=s;idIdx=0;started=false;clearWatch();
  document.body.classList.add('night');$('#nowTitle').textContent=s.title+', '+s.artist;$('#nowStatus').textContent='Loading the music…';$('#skip').style.display='none';
  go('now');
  if(!ytApi||!window.YT||!YT.Player){watch.push(setTimeout(()=>{if(ytApi&&window.YT&&YT.Player)makePlayer();else noYouTube()},3500));return}
  makePlayer();
}
function makePlayer(){
  const w=$('#ytwrap');w.classList.remove('mini');w.classList.add('show');
  if(player){player.loadVideoById(song.ids[idIdx]);armWatch();return}
  player=new YT.Player('yt',{videoId:song.ids[idIdx],playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1,controls:1},
    events:{onReady:e=>{e.target.unMute();e.target.setVolume(100);e.target.playVideo()},onStateChange:ytState,onError:ytError}});
  armWatch();
}
function armWatch(){clearWatch();
  watch.push(setTimeout(()=>{if(!started)$('#nowStatus').textContent='If the music hasn\'t started, tap the video once ▶'},3000));
  watch.push(setTimeout(()=>{if(!started)$('#skip').style.display='inline-block'},12000))}
function ytState(e){
  if(e.data===YT.PlayerState.PLAYING){mode='yt';ytOn=true;ytT=player.getCurrentTime();ytAt=performance.now();
    if(!started){started=true;clearWatch();D=player.getDuration()||0;beginStory()}}
  else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.BUFFERING){ytT=player.getCurrentTime();ytOn=false}
  else if(e.data===YT.PlayerState.ENDED){ytOn=false;ytT=D;showEnd()}
  $('#pause').textContent=ytOn?'❚❚':'▶';$('#pause').setAttribute('aria-label',ytOn?'Pause':'Play');
}
function ytError(){ if(++idIdx<song.ids.length){player.loadVideoById(song.ids[idIdx]);return} noYouTube() }
setInterval(()=>{if(mode==='yt'&&player&&player.getCurrentTime){const c=player.getCurrentTime();if(Math.abs(c-clock())>.35||!ytOn){ytT=c;ytAt=performance.now()}
  const d=player.getDuration();if(d&&Math.abs(d-D)>1&&started){D=d;buildTimeline()}}},250);

function noYouTube(){ // offline or opened as a plain file: use music.mp3 if present, else run on its own
  clearWatch();$('#ytwrap').classList.remove('show');
  local.play().then(()=>{mode='audio';D=local.duration||230;started=true;beginStory()}).catch(()=>{
    mode='timer';D=230;tBase=0;tAt=performance.now();tOn=true;started=true;beginStory();
    note('The song couldn\'t load here. Open the site from its web link to hear it.')});
}
$('#skip').onclick=()=>{if(player&&player.stopVideo)player.stopVideo();noYouTube()};
local.addEventListener('ended',showEnd);
function note(t){const n=$('#notice');n.textContent=t;n.style.opacity=1;setTimeout(()=>n.style.opacity=0,6000)}

/* =================== 4. Story engine =================== */
let beats=[],cur=-1,curLine=null,keepScene=null,shownCh='',saidYes=false,ended=false,bgFlip=false;
function buildTimeline(){
  const intro=Math.min(7,D*.035),finStart=Math.max(D*.8,D-60),endPad=2;
  const body=STORY.filter(b=>!b.fin),fin=STORY.filter(b=>b.fin);
  const W=body.reduce((a,b)=>a+(b.w||1),0);let t=intro;
  beats=STORY.map(b=>Object.assign({},b));
  beats.filter(b=>!b.fin).forEach(b=>{b.start=t;b.dur=(finStart-intro)*(b.w||1)/W;t+=b.dur});
  const fd=(D-endPad-finStart)/fin.length;beats.filter(b=>b.fin).forEach((b,i)=>{b.start=finStart+i*fd;b.dur=fd});
  // chapter ticks on the progress bar
  $('#track').querySelectorAll('b').forEach(x=>x.remove());let last='';
  beats.forEach(b=>{if(b.ch!==last){last=b.ch;const m=document.createElement('b');m.style.left=(b.start/D*100)+'%';$('#track').appendChild(m)}});
}
function beginStory(){
  if(!D||D<30)D=230;buildTimeline();cur=-1;ended=false;saidYes=false;keepScene=null;
  $('#media').innerHTML='';$('#lyric').innerHTML='';$('#endctl').classList.remove('show');shownCh='';$('#chapter').textContent='';introCard();
  $('#barTitle').textContent=song.title+'  ·  '+song.artist;
  go('story');setTimeout(()=>$('#ytwrap').classList.add('mini'),300);
}

function setBg(k){if(!k)return;const a=$('#bgA'),b=$('#bgB');const [on,off]=bgFlip?[a,b]:[b,a];bgFlip=!bgFlip;
  on.style.backgroundImage='url('+src(k)+')';on.classList.add('on');off.classList.remove('on')}

function sceneFor(b){
  const d=document.createElement('div');d.className='scene '+b.layout;d.style.setProperty('--dur',b.dur+'s');const m=b.m||[];
  const img=(k,cls)=>'<img src="'+src(k)+'" alt="" class="'+(cls||'')+'">';
  if(b.layout==='single'){if(cur%2)d.classList.add('alt');d.innerHTML='<figure class="pol"><div class="ph">'+img(m[0],'kb dev')+'</div></figure>'}
  else if(b.layout==='duo')d.innerHTML='<figure class="pol"><div class="ph">'+img(m[0],'dev')+'</div></figure><figure class="pol"><div class="ph">'+img(m[1],'dev')+'</div></figure>';
  else if(b.layout==='film')d.innerHTML='<div class="filmwrap"><div class="strip">'+m.concat(m).map(k=>'<div class="fr">'+img(k)+'</div>').join('')+'</div></div>';
  else if(b.layout==='video')d.innerHTML='<div class="phone"><video src="vid/'+m[0]+'.mp4" poster="vid/'+m[0]+'.jpg" muted playsinline autoplay loop></video></div>';
  else if(b.layout==='full')d.innerHTML='<div class="frame">'+img(m[0],'kb')+'</div>';
  else if(b.layout==='art')d.innerHTML='<img src="img/line-light.png" alt="Line drawing of the two of you">';
  else if(b.layout==='mosaic')d.appendChild(mosaic());
  return d;
}
function mosaic(){
  const box=$('#media').getBoundingClientRect(),H=box.height,Wd=Math.min(innerWidth*.86,H*1.15);
  const wrap=document.createElement('div');wrap.className='heart';
  const cols=8,rows=7,cell=Math.min(Wd/cols,H/rows),pics=PHOTOS.concat(['v1','v2','v3','v4']);
  const ox=(Wd-cell*cols)/2,oy=(H-cell*rows)/2;let n=0;const tiles=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=((c+.5)/cols-.5)*2.6,y=(.5-(r+.5)/rows)*2.5+.25;
    if(Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0.02){
      const t=document.createElement('div');t.className='tile';const s=cell-4;
      t.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(ox+c*cell+2)+'px;top:'+(oy+r*cell+2)+'px;opacity:0;transition-delay:'+(n*.07)+'s';
      const a=Math.random()*Math.PI*2;t.style.transform='translate('+Math.cos(a)*innerWidth+'px,'+Math.sin(a)*innerHeight+'px) rotate('+(Math.random()*120-60)+'deg)';
      t.innerHTML='<img src="'+src(pics[n%pics.length])+'" alt="">';wrap.appendChild(t);tiles.push(t);n++}}
  requestAnimationFrame(()=>requestAnimationFrame(()=>tiles.forEach(t=>{t.style.opacity=1;t.style.transform='rotate('+(Math.random()*8-4)+'deg)'})));
  return wrap;
}
function showBeat(i){
  cur=i;const b=beats[i],prev=beats[i-1];
  if(shownCh!==b.ch){shownCh=b.ch;const c=$('#chapter');c.style.opacity=0;setTimeout(()=>{c.textContent=b.ch;c.style.opacity=1},500)}
  // media
  const sameMosaic=keepScene==='mosaic'&&b.layout==='mosaic';
  if(!sameMosaic){keepScene=['text','question'].includes(b.layout)?null:b.layout;
    $('#media').querySelectorAll('.scene').forEach(s=>{s.classList.add('out');setTimeout(()=>s.remove(),900)});
    if(!['text','question'].includes(b.layout))$('#media').appendChild(sceneFor(b));
  }
  if(b.m)setBg(b.m[0]);
  // lyric line
  const L=$('#lyric');L.classList.toggle('center',['text','question'].includes(b.layout));
  if(curLine){const o=curLine;o.classList.add('out');setTimeout(()=>o.remove(),900)}
  L.querySelectorAll('.answers,.said').forEach(x=>x.remove());
  const line=document.createElement('p');line.className='line enter'+(b.hand?' hand':'');
  line.setAttribute('aria-label',b.text);
  b.text.split(' ').forEach((w,k,arr)=>{const s=document.createElement('span');s.className='wd';s.setAttribute('aria-hidden','true');s.textContent=w+(k<arr.length-1?' ':'');line.appendChild(s)});
  L.appendChild(line);curLine=line;requestAnimationFrame(()=>requestAnimationFrame(()=>line.classList.remove('enter')));
  if(b.layout==='question')askForever();
  // effects
  if(b.fx==='burst')setTimeout(()=>{hearts(innerWidth/2,innerHeight*.4,60,260);flare=1},400);
  if(b.fx==='glow')flare=.6;
}
function introCard(){const L=$('#lyric');L.innerHTML='';L.classList.add('center');const p=document.createElement('p');p.className='line hand enter';p.textContent='no need to touch anything. just watch, love ♥';L.appendChild(p);curLine=p;requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.remove('enter')))}
function askForever(){
  const L=$('#lyric');
  if(saidYes){const s=document.createElement('p');s.className='said';s.textContent='you said yes ♥';L.appendChild(s);placeBelow(s);return}
  const a=document.createElement('div');a.className='answers';
  ['Yes','Yes, forever'].forEach(t=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=t;
    b.onclick=e=>{e.stopPropagation();saidYes=true;hearts(e.clientX,e.clientY,70,280);flare=1;a.remove();const s=document.createElement('p');s.className='said';s.textContent='you said yes ♥';L.appendChild(s);placeBelow(s)};a.appendChild(b)});
  L.appendChild(a);placeBelow(a);
}
function placeBelow(el){requestAnimationFrame(()=>{el.style.top=(curLine?curLine.offsetHeight+18:0)+'px'})}
function showEnd(){if(ended)return;ended=true;$('#endctl').classList.add('show')}
$('#again').onclick=()=>{$('#endctl').classList.remove('show');ended=false;cur=-1;
  if(mode==='yt'){player.seekTo(0,true);player.playVideo();ytT=0;ytAt=performance.now()}
  else if(mode==='audio'){local.currentTime=0;local.play()}else{tBase=0;tAt=performance.now();tOn=true}
  $('#media').innerHTML='';$('#lyric').innerHTML='';curLine=null;keepScene=null;shownCh='';introCard()};
$('#another').onclick=()=>{if(player&&player.stopVideo)player.stopVideo();local.pause();tOn=false;mode=null;started=false;
  $('#ytwrap').classList.remove('show','mini');document.body.classList.remove('night');document.querySelectorAll('.song').forEach(x=>x.classList.remove('chosen'));go('pick')};
$('#pause').onclick=e=>{e.stopPropagation();togglePause();if(mode!=='yt'){const p=playing();$('#pause').textContent=p?'❚❚':'▶'}};
$('#story').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;hearts(e.clientX,e.clientY,8,70)});

/* ---------- ambient light particles ---------- */
const fx=$('#fx'),cx=fx.getContext('2d');let FW=0,FH=0,flare=0;const DPR=Math.min(2,devicePixelRatio||1);
function fit(){FW=innerWidth;FH=innerHeight;fx.width=FW*DPR;fx.height=FH*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}fit();addEventListener('resize',fit);
const motes=[...Array(reduce?0:46)].map(()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*3.5,v:.0004+Math.random()*.0012,p:Math.random()*6.28,c:HC[Math.floor(Math.random()*4)]}));

/* ---------- main loop ---------- */
function loop(){
  requestAnimationFrame(loop);
  if(!$('#story').classList.contains('show'))return;
  const t=clock();
  // particles
  cx.clearRect(0,0,FW,FH);flare*=.97;
  motes.forEach(m=>{m.y-=m.v*(1+flare*6);m.p+=.02;if(m.y<-.02){m.y=1.02;m.x=Math.random()}
    const x=m.x*FW+Math.sin(m.p)*12,y=m.y*FH,r=m.r*(1+flare*1.5);
    cx.globalAlpha=.35+.3*Math.sin(m.p*1.3)+flare*.3;cx.fillStyle=m.c;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()});
  cx.globalAlpha=1;
  if(!beats.length)return;
  // which line
  let i=cur<0?0:cur;while(i<beats.length-1&&t>=beats[i+1].start)i++;while(i>0&&t<beats[i].start)i--;
  if(t>=beats[0].start&&i!==cur)showBeat(i);
  if(cur>=0&&curLine&&curLine.firstChild&&curLine.firstChild.className==='wd'){const b=beats[cur],ws=curLine.children,n=ws.length;
    const lp=Math.min(1,Math.max(0,(t-b.start)/Math.max(1.2,Math.min(b.dur*.62,n*.55))))*n;
    for(let k=0;k<n;k++)ws[k].style.setProperty('--p',Math.min(1,Math.max(0,lp-k)).toFixed(3))}
  $('#prog').style.width=Math.min(100,t/D*100)+'%';$('#barTime').textContent=fmt(t)+' / '+fmt(D);
  if(mode!=='yt'&&t>=D-.2)showEnd();
}
requestAnimationFrame(loop);
</script>
